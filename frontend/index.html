<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LogisticsPro — Move India Faster</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts: Syne (Display), Manrope (Body), JetBrains Mono (Code/Telemetry), Oxanium (Sidebar/Cockpit), Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Oxanium:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet & MarkerCluster CSS for Map integration -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>
    
    <style>
      /* Fallback styles before React bundle loads */
      body {
        margin: 0;
        background-color: #06080a;
        color: #eef2e6;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #c8ff2e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .preloader-title {
        font-family: 'Syne', sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #c8ff2e;
        margin-bottom: 8px;
      }
      .preloader-sub {
        font-size: 13px;
        color: #7f8a79;
        max-width: 460px;
        line-height: 1.5;
      }
      .preloader-tip {
        margin-top: 24px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        background: #0d1114;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 10px 18px;
        color: #b7c1ae;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="preloader-spinner"></div>
        <div class="preloader-title">Logistics//Pro Loading...</div>
        <div class="preloader-sub">Initializing geospatial routing engine, Indian freight corridor network, and telemetry state.</div>
        <div class="preloader-tip">
          ⚡ <strong>SYS:</strong> Starting React 19 Client · 14 Freight Hubs Online
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; color: #ff5a1f;">
        JavaScript is required to run the Delivery & Logistics Optimizer. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
